<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Masuk - AKKA</title>
<link rel="icon" type="image/png" href="assets/logo/logo-akka.png" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>

<main class="page page--center">
  <section class="login-card card">
    <div class="login-card__brand">
      <img src="assets/logo/logo-akka.png" alt="Logo AKKA" class="login-card__logo" />
    </div>

    <form id="loginForm" class="login-form" novalidate>
      <div class="form-group">
        <label for="inputNama">Nama Lengkap</label>
        <input type="text" id="inputNama" name="nama" class="form-control" placeholder="Tulis nama lengkapmu" autocomplete="off" required />
        <span class="form-error" id="errNama"></span>
      </div>

      <div class="form-group">
        <label for="inputKelas">Kelas</label>
        <select id="inputKelas" name="kelas" class="form-control" required>
          <option value="" disabled selected>Pilih kelas</option>
          <option value="5A">Kelas 5A</option>
          <option value="5B">Kelas 5B</option>
          <option value="5C">Kelas 5C</option>
          <option value="5D">Kelas 5D</option>
          <option value="5E">Kelas 5E</option>
          <option value="6A">Kelas 6A</option>
          <option value="6B">Kelas 6B</option>
          <option value="6C">Kelas 6C</option>
          <option value="6D">Kelas 6D</option>
          <option value="6E">Kelas 6E</option>
        </select>
        <span class="form-error" id="errKelas"></span>
      </div>
     
      <div class="form-group">
        <label for="inputAbsen">Nomor Absen</label>
        <input type="number" min="1" max="60" id="inputAbsen" name="absen" class="form-control" placeholder="Contoh: 12" autocomplete="off" required />
        <span class="form-error" id="errAbsen"></span>
      </div>

      <div class="form-group">
        <label for="inputPassword">Kata Sandi</label>
        <input type="text" id="inputPassword" name="password" class="form-control" placeholder="Masukkan Kata Sandi" autocomplete="off" required />
        <span class="form-error" id="errPassword"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btnMasuk">Masuk</button>
    </form>
  </section>
</main>

<footer class="app-footer">
  <p>© <span id="tahunFooter"></span> AKKA - Asesmen Koding dan Kecerdasan Artifisial</p>
</footer>

<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
